name: Build and GH-Pages Deploy

# Publica la versión estática en GitHub Pages. En Pages no hay servidor, así que
# para conectar listas de MAL por nombre de usuario define la variable de
# repositorio MAL_PROXY con la URL de un proxy (p. ej. el despliegue en Vercel
# de este mismo repo: https://tu-app.vercel.app/api/mal). Sin ella siguen
# funcionando AniList y la importación del XML de MAL.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_MAL_PROXY: ${{ vars.MAL_PROXY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
