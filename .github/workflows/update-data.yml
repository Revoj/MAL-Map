name: Actualizar datos

# Regenera public/data/anime.json cada mes con los datos más recientes.
# Opcional: añade el secreto MAL_CLIENT_ID para incluir puntuaciones y
# recomendaciones de MyAnimeList (https://myanimelist.net/apiconfig).

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/anime.json
          git diff --cached --quiet || git commit -m "Actualizar datos ($(date -u +%Y-%m-%d))"
          git push
